<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>

    <!-- Подключение шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="calculator-card">


            <h2 style="font-size:32px;">Заполните параметры для выполнения расчёта</h2><br>


            <form id="calculatorForm">

                <div class="form-group">
    <label>Выберите Ваш вид деятельности</label>

                    <div class="type-list">

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.1" checked>
                            <span>Образование</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.3">
                            <span>Транспорт</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.4">
                            <span>Телеком</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.5">
                            <span>Потребительские товары</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.6">
                            <span>Медицина</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.7">
                            <span>Страхование</span>
                        </label>

			<label class="radio-item">
                            <input type="radio" name="type" value="4.1">
                            <span>ЖКУ</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="2.8">
                            <span>Инвестиционные фонды, УК, НПФ</span>
                        </label>

			<label class="radio-item">
                            <input type="radio" name="type" value="2.2">
                            <span>Благотворительность</span>
                        </label>

                        <label class="radio-item">
                            <input type="radio" name="type" value="3.1">
                            <span>Иное</span>
                        </label>

                    </div>
                </div>

                <div class="form-group">
                <label>Период</label>

                <div class="period-selector">

                    <input
                        type="radio"
                        id="month"
                        name="period"
                        value="1"
                        checked
                    >

                    <label for="month" class="period-btn">
                        Месяц
                    </label>

                    <input
                        type="radio"
                        id="quarter"
                        name="period"
                        value="3"
                    >

                    <label for="quarter" class="period-btn">
                        Квартал
                    </label>

                    <input
                        type="radio"
                        id="year"
                        name="period"
                        value="12"
                    >

                    <label for="year" class="period-btn">
                        Год
                    </label>

                </div>
            </div>

                <div class="form-group">
                    <label for="amount">Введите среднюю выручку за месяц</label>
                    <input
                        type="text"
                        id="amount"
                        inputmode="numeric"
                        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                        placeholder="Например: 1000"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Рассчитать
                </button>

            </form>

        </div>
    </div>

    <script src = "script.js"></script>

</body>
</html>
